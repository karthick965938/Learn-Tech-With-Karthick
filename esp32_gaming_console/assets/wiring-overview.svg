<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">ESP32 handheld console — wiring overview</title>
  <desc id="d">ESP32 DevKit connected to SSD1306 OLED, four tactile buttons to GND, and passive buzzer on GPIO25.</desc>
  <rect width="100%" height="100%" fill="#12141a"/>
  <text x="320" y="32" fill="#e8eaef" font-family="system-ui,sans-serif" font-size="18" font-weight="600" text-anchor="middle">Wiring overview (concept)</text>
  <!-- ESP -->
  <rect x="220" y="70" width="200" height="220" rx="14" fill="#1e232d" stroke="#4a5263" stroke-width="2"/>
  <text x="320" y="108" fill="#8ab4f8" font-family="ui-monospace,monospace" font-size="14" font-weight="700" text-anchor="middle">ESP32 DevKit V1</text>
  <text x="320" y="138" fill="#c4c7d1" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">I2C: GPIO21 SDA, GPIO22 SCL</text>
  <text x="320" y="162" fill="#c4c7d1" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">Buttons ? GND: 17 16 4 5</text>
  <text x="320" y="186" fill="#c4c7d1" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">Buzzer: GPIO25 + 100–220?</text>
  <text x="320" y="220" fill="#81c995" font-family="ui-monospace,monospace" font-size="10" text-anchor="middle">3V3 + GND to OLED</text>
  <!-- OLED -->
  <rect x="40" y="100" width="140" height="90" rx="8" fill="#0a0a0a" stroke="#5f6368"/>
  <rect x="50" y="110" width="120" height="56" rx="2" fill="#061208" stroke="#34a853"/>
  <text x="110" y="148" fill="#7ae582" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">SSD1306</text>
  <text x="110" y="210" fill="#9aa0a6" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">128×64 OLED</text>
  <path d="M180 145 H210 V120 H220" fill="none" stroke="#8ab4f8" stroke-width="2.5"/>
  <!-- Buttons cluster -->
  <g fill="#2d3139" stroke="#9aa0a6">
    <circle cx="520" cy="120" r="20"/>
    <circle cx="520" cy="180" r="20"/>
    <circle cx="470" cy="240" r="20"/>
    <circle cx="570" cy="240" r="20"/>
  </g>
  <text x="520" y="124" fill="#e8eaef" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">UP</text>
  <text x="520" y="184" fill="#e8eaef" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">DN</text>
  <text x="470" y="244" fill="#e8eaef" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">L</text>
  <text x="570" y="244" fill="#e8eaef" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">R</text>
  <path d="M420 120 H500" fill="none" stroke="#fdd663" stroke-width="2"/>
  <path d="M420 180 H500" fill="none" stroke="#fdd663" stroke-width="2"/>
  <path d="M420 240 H450" fill="none" stroke="#fdd663" stroke-width="2"/>
  <path d="M420 240 H590" fill="none" stroke="#fdd663" stroke-width="2"/>
  <!-- Buzzer -->
  <rect x="480" y="275" width="64" height="36" rx="6" fill="#2a2418" stroke="#f9ab00"/>
  <text x="512" y="297" fill="#fdd663" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">Buzzer</text>
  <path d="M512 275 V250 H360 V200" fill="none" stroke="#f28b82" stroke-width="2"/>
  <text x="320" y="340" fill="#9aa0a6" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Use the pin tables in README.md for your exact DevKit silkscreen.</text>
</svg>
